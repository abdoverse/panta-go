name: panta
description: A high grade recycling application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  intl: ^0.20.2
  provider: ^6.1.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  uuid: ^4.2.0
  cupertino_icons: ^1.0.6
  glassmorphism: ^3.0.0 # For that high-grade feel
  dotted_border: ^2.1.0
  collection: ^1.18.0
  http: ^1.2.0
  amazon_cognito_identity_dart_2: ^3.0.0
  shared_preferences: ^2.2.0
  web_socket_channel: ^3.0.3
  flutter_typeahead: ^5.0.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TABLE_NAME=${TABLE_NAME}
      - AWS_REGION=${AWS_REGION}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - AWS_PROFILE=${AWS_PROFILE}
      - AWS_SHARED_CREDENTIALS_FILE=/aws/credentials
      - AWS_CONFIG_FILE=/aws/config
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-services.json
    user: root # Run as root to access mounted ~/.aws host files
    volumes:
      - ~/.aws:/aws:ro

name: panta
description: A high grade recycling application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.2.1
  intl: ^0.20.2
  provider: ^6.1.1
  confetti: ^0.8.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  uuid: ^4.6.0
  cupertino_icons: ^1.0.6
  glassmorphism: ^3.0.0 # For that high-grade feel
  dotted_border: ^3.1.0
  collection: ^1.18.0
  http: ^1.2.0
  amazon_cognito_identity_dart_2: ^4.0.1
  shared_preferences: ^2.2.0
  web_socket_channel: ^3.0.3
  flutter_typeahead: ^6.0.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  geolocator: ^14.0.3
  image_picker: ^1.1.2
  http_parser: ^4.1.2
  url_launcher: ^6.3.1
  flutter_chat_ui: ^1.6.6
  flutter_chat_types: ^3.6.0
  qr_flutter: ^4.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

workflows:
  ios-altstore:
    name: iOS Build — AltStore Sideload
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.abdoverse.panta
      # Add GOOGLE_SERVICE_INFO_PLIST as a base64-encoded secret in Codemagic UI
      # (Environment variables → Secret → name: GOOGLE_SERVICE_INFO_PLIST)

    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > mobile/ios/Runner/GoogleService-Info.plist

      - name: Get Flutter packages
        script: |
          cd mobile
          flutter pub get

      - name: Build iOS (no codesign)
        script: |
          cd mobile
          
          # Force Xcode to disable code signing by overriding the xcconfig
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = -" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY = -" >> ios/Flutter/Release.xcconfig
          
          flutter build ios --release --no-codesign
          
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "❌ Runner.app was not generated."
            exit 1
          fi

      - name: Package .ipa for AltStore
        script: |
          cd mobile/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Panta.ipa Payload
          echo "✅ Panta.ipa ready"

    artifacts:
      - mobile/build/ios/iphoneos/Panta.ipa



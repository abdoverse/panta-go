workflows:
  ios-altstore:
    name: iOS Build — AltStore Sideload
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.abdoverse.panta
      # Add GOOGLE_SERVICE_INFO_PLIST as a base64-encoded secret in Codemagic UI
      # (Environment variables → Secret → name: GOOGLE_SERVICE_INFO_PLIST)

    scripts:
      - name: Inject GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > mobile/ios/Runner/GoogleService-Info.plist

      - name: Get Flutter packages
        script: |
          cd mobile
          flutter pub get

      - name: Build iOS (no codesign)
        script: |
          cd mobile
          
          # 1. Run flutter build to compile Dart AOT and setup plugins.
          # It will fail at the end because Flutter's CLI strictly demands a Dev Team, 
          # but the Dart compilation (App.framework) will succeed.
          flutter build ios --release --no-codesign || true
          
          # 2. Run Xcodebuild directly to package the Runner.app.
          # We pass CODE_SIGNING_ALLOWED=NO directly to xcodebuild to bypass Apple's signing.
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            -quiet
          
          cd ..
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "❌ Runner.app was not generated."
            exit 1
          else
            echo "✅ Runner.app generated successfully!"
          fi

      - name: Package .ipa for AltStore
        script: |
          cd mobile/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Panta.ipa Payload
          echo "✅ Panta.ipa ready"

    artifacts:
      - mobile/build/ios/iphoneos/Panta.ipa



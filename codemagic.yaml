workflows:
  ios-workflow:
    name: iOS Build (Sideload)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd my-app/mobile
          flutter packages get
      - name: Install pods
        script: |
          cd my-app/mobile/ios
          pod install
      - name: Build iOS App (No Signing)
        script: |
          cd my-app/mobile
          flutter build ios --release --no-codesign
    artifacts:
      - my-app/mobile/build/ios/iphoneos/Runner.app

